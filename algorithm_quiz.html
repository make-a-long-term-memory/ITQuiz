/* 배치: 위에 9칸 보드, 가운데 문제 카드, 아래에 단계마다 자라나는 순서도(전개도) */
:root{
  --bg:#e6ebfb; --bg2:#d8dff8; --bg3:#cdd6f4;
  --fg:#33313b; --sub:#686571; --card:#ffffff; --chip:#f7f2e6;
  --line:#ddd7e6; --shadow:#c9c2d5; --hover:#b5adc6;
  --accent:#c2701c; --accent-sh:#8f520f; --accent-soft:#f6e3cb; --accent-ink:#8a4d0c;
  --ok:#3d6e56; --okbg:#ebf2ee; --bad:#b25d6c; --badbg:#f9eff1;
  --code:#2e2e38; --codefg:#eceaf2; --star:#e2b23a;
  --btn2:#2f9a80; --btn2-sh:#1f6e5b; --num:#ebe3d0; --numfg:#5b5243;
  --font:'KoPubWorld Dotum','KoPubWorld돋움체','KoPub돋움체','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:"Nanum Gothic Coding","D2Coding",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  background-color:#dbe2f8; background-image:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-size:100% 100%; background-attachment:fixed; min-height:100vh; letter-spacing:-0.01em; word-break:keep-all; color:var(--fg);
  font-family:var(--font); font-size:16px; line-height:1.4; text-align:left;
  padding-block:20px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
header .pre{font-weight:700;color:#33303c;font-size:min(.95rem,3.6vw)}
header h1{margin:2px 0 4px;font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.15;text-wrap:balance}
header p{margin:0;color:var(--sub)}
.box{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.big{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 5px 0 var(--shadow);min-width:0}

/* 보드 */
.hud{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.hud b{font-variant-numeric:tabular-nums}
.stars{color:var(--star);letter-spacing:1px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{
  position:relative;min-height:84px;border:2.5px solid var(--line);border-radius:12px;background:var(--card);
  padding:8px 8px 8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0;
  box-shadow:0 4px 0 var(--shadow);font-size:.84rem;line-height:1.25
}
.tile .no{width:26px;height:26px;border-radius:50%;background:var(--num);color:var(--numfg);font-weight:700;display:grid;place-items:center;font-size:.82rem}
.tile .nm{font-weight:700;overflow-wrap:anywhere}
.tile.done{background:var(--okbg)}
.tile.done .no{background:var(--ok);color:#fff}
.tile.now{border-color:var(--accent);box-shadow:0 4px 0 var(--accent-sh)}
.tile.lock{opacity:.55}
.tile .tok{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 0 0 2px var(--accent);animation:pop .4s}
.tile .flag{position:absolute;right:8px;bottom:6px;font-size:.75rem;color:var(--sub)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}

/* 문제 카드 */
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:.82rem;border-radius:999px;padding:3px 10px}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.qtitle{margin:10px 0 6px;font-size:1.18rem;line-height:1.12;font-weight:700;text-wrap:balance}
.know{background:var(--chip);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.know h4{margin:0 0 4px;font-size:.95rem;color:var(--accent-ink)}
.know p{margin:0}
.hint{border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:.95rem;line-height:1.3;background:var(--card)}
.hint b{color:var(--accent-ink)}
pre.code{background:var(--code);color:var(--codefg);font-family:var(--mono);font-size:.9rem;line-height:1.45;border-radius:12px;padding:12px;margin:10px 0;overflow-x:auto}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.opt{
  display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;
  background:var(--card);border:2.5px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 4px 0 var(--shadow)
}
.opt:hover:not(:disabled){border-color:var(--hover);box-shadow:0 4px 0 var(--hover)}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:.82rem;color:var(--fg)}
.opt.right{background:var(--okbg)} .opt.right .n{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badbg)} .opt.wrong .n{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
button:focus-visible,.opt:focus-visible,.slot:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{border-radius:12px;padding:10px 12px;margin-top:12px;border:2px solid var(--line)}
.msg.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.msg.no{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.msg b{display:block;margin-bottom:2px}
.msg span{color:var(--fg)}
.btn{font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:12px;padding:11px 20px;cursor:pointer;box-shadow:0 4px 0 var(--accent-sh)}
.btn.go{background:var(--btn2);box-shadow:0 4px 0 var(--btn2-sh)}
.btn.sub{background:var(--card);color:var(--fg);border:2.5px solid var(--line);box-shadow:0 4px 0 var(--shadow)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-sh)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.center{display:flex;justify-content:center;margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.diff{margin-top:14px;padding-top:10px;border-top:2px solid var(--line);color:var(--sub);font-size:.85rem}
.diff .stars{margin-left:4px}

/* 순서 맞추기, 짝짓기 */
.pool,.seq{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.chip{font:inherit;color:inherit;text-align:left;background:var(--card);border:2.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.chip:hover:not(:disabled){border-color:var(--hover)}
.chip.used{opacity:.35}
.slotrow{display:flex;gap:8px;align-items:center}
.slotrow .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--num);color:var(--numfg);font-weight:700;display:grid;place-items:center;font-size:.82rem}
.slot{flex:1;min-height:42px;border:2px solid var(--line);background:var(--chip);border-radius:12px;padding:9px 12px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.slot.fill{background:var(--card);border-color:var(--hover)}
.slot.ok{background:var(--okbg);border-color:var(--ok)}
.slot.bad{background:var(--badbg);border-color:var(--bad)}
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;margin-top:10px;align-items:center}
.pairs select{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px;width:100%;min-width:0}
.pairs select.ok{background:var(--okbg);border-color:var(--ok)}
.pairs select.bad{background:var(--badbg);border-color:var(--bad)}
.sym{display:flex;gap:10px;align-items:center;min-width:0}
.sym svg{flex:none;width:64px;height:38px}
.numin{font:inherit;font-size:1.1rem;width:120px;border:2.5px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--card);color:var(--fg)}

/* 순서도 */
.fc{width:100%;height:auto;display:block;max-width:100%}
.fc text{font-family:var(--font);font-size:13px;fill:var(--fg)}
.fc .sh{fill:var(--card);stroke:var(--accent);stroke-width:2.2}
.fc .sh.term{fill:var(--accent-soft)}
.fc .ln{stroke:var(--sub);stroke-width:2;fill:none}
.fc .lb{font-size:12px;fill:var(--accent-ink);font-weight:700}
.fc .blank .sh{fill:var(--chip);stroke:var(--bad);stroke-width:2.2}
.fc .blank text{fill:var(--bad);font-weight:700}
.fc .hit .sh{fill:var(--accent-soft)}
.fcbox{overflow-x:auto;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;margin:10px 0}
.fcbox .fc{min-width:300px}
.ghost{opacity:.18}
.chart-title{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.chart-title h3{margin:0;font-size:1.05rem}
.chart-title span{color:var(--sub);font-size:.9rem}
.final{text-align:left}
.final h2{margin:6px 0;font-size:1.5rem}
footer{color:var(--sub);font-size:.85rem;display:flex;flex-direction:column;gap:4px;padding-top:4px}
footer a{color:var(--sub)}
@media (min-width:561px){
  .tile{min-height:96px;font-size:.92rem}
  .qtitle{font-size:1.3rem}
  .big{padding:24px}
}
@media (prefers-reduced-motion:reduce){.tile .tok{animation:none}}


.strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.strip span{width:28px;height:28px;border-radius:50%;background:var(--num);color:var(--numfg);font-weight:700;font-size:.8rem;display:grid;place-items:center}
.strip span.done{background:var(--ok);color:#fff}
.strip span.now{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.mapbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.mapbar .cap{color:var(--sub);font-size:.88rem}
.sbtn{font:inherit;font-size:.85rem;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:5px 10px;cursor:pointer}
.sbtn:hover{border-color:var(--hover)}
.mapbox{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;overflow:hidden}
.mapbox .fc{max-height:340px}
.fc .tok{fill:var(--accent);stroke:var(--card);stroke-width:3;transition:transform .7s ease}
.fc .neutral .sh{fill:var(--chip);stroke:var(--sub)}
.sit{background:var(--chip);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.sit b{color:var(--accent-ink)}
.step{margin-top:14px;padding-top:12px;border-top:2px solid var(--line)}
.step h3{margin:0;font-size:1.05rem;line-height:1.2;text-wrap:balance}
.stepno{display:inline-block;color:var(--accent-ink);font-weight:700;font-size:.85rem;margin-bottom:2px}
.done-steps{display:flex;flex-direction:column;gap:3px;color:var(--ok);font-size:.9rem;margin-top:10px}
.symgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-top:12px}
.symbtn{display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:inherit;cursor:pointer;background:var(--card);border:2.5px solid var(--line);border-radius:12px;padding:8px 6px;box-shadow:0 4px 0 var(--shadow)}
.symbtn:hover:not(:disabled){border-color:var(--hover);box-shadow:0 4px 0 var(--hover)}
.symbtn svg{width:88px;height:52px;display:block}
.symbtn.right{background:var(--okbg)}
.symbtn.wrong{background:var(--badbg)}
.symbtn:disabled{cursor:default}
.symbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yn .opt{justify-content:center;font-weight:700;font-size:1.05rem}


.fc .on{stroke:var(--accent);stroke-width:3.4}
.fc .focus .sh{fill:var(--accent-soft);stroke:var(--accent-ink);stroke-width:3.4}
.fc .ynbtn{cursor:pointer}
.fc .ynbtn rect{fill:var(--card);stroke:var(--accent);stroke-width:2.4}
.fc .ynbtn text{fill:var(--accent-ink);font-weight:700;font-size:13px}
.fc .ynbtn:hover rect,.fc .ynbtn:focus rect{fill:var(--accent-soft)}
.fc .ynbtn.wrong rect{fill:var(--badbg);stroke:var(--bad)}
.fc .pickable{cursor:pointer}
.fc .pickable .sh{stroke-width:3;fill:var(--accent-soft)}
.fc .pickable:hover .sh{fill:var(--card)}
.fc .pickable.wrong .sh{fill:var(--badbg);stroke:var(--bad)}
.fc .pickable.right .sh{fill:var(--okbg);stroke:var(--ok)}
.fc .pbadge circle{fill:var(--accent);stroke:var(--card);stroke-width:2}
.fc .pbadge text{fill:#fff;font-weight:700;font-size:12px}
.fc g:focus-visible{outline:3px solid var(--accent)}
#map.full .fc{max-height:none;max-width:440px;margin:0 auto}
.finalbox h2{margin:6px 0;font-size:1.5rem}


.symbtn .ko{font-weight:700;font-size:.9rem;line-height:1.15;text-align:center}
.symbtn .en{color:var(--sub);font-size:.72rem;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.fc .sh2{fill:none;stroke:var(--accent);stroke-width:2.2}
.dict summary{cursor:pointer;font-weight:700;color:var(--accent-ink)}
.dict summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.dnote{margin:10px 0 0;color:var(--sub);font-size:.88rem}
.dlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:12px}
.drow{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card);min-width:0}
.dsym{flex:none;width:68px}
.dsym svg{width:68px;height:40px;display:block}
.dtxt{min-width:0;font-size:.92rem;line-height:1.3}
.den{color:var(--sub);font-size:.82rem;overflow-wrap:anywhere}
.duse{color:var(--fg);margin-top:2px}
.dlv{display:inline-block;margin-top:4px;font-size:.76rem;font-weight:700;border-radius:999px;padding:2px 8px}
.dlv.lv1{background:var(--accent-soft);color:var(--accent-ink)}
.dlv.lv2{background:var(--okbg);color:var(--ok)}
.dlv.lv3{background:var(--chip);color:var(--sub)}

.crumbs{display:flex;flex-wrap:nowrap;white-space:nowrap;align-items:center;gap:6px 8px}
.crumb{display:inline-block;font-weight:700;font-size:.92rem;line-height:1.4;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 14px;box-shadow:0 3px 0 var(--shadow);text-decoration:none;cursor:pointer}
a.crumb:hover{border-color:var(--hover)}
.crumb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.crumb-sep{color:var(--sub);font-weight:800}
  .crumb.cur{display:inline-flex;align-items:baseline;gap:10px;cursor:default;box-shadow:none;background:none;border:0;border-radius:0;padding:0 2px;font-size:.92rem;min-width:0;color:#33303c}
  .crumb.cur:active{transform:none}
  .crumb.cur b{font-weight:800;font-size:inherit}
  .crumb.cur .stp{font-size:inherit;font-weight:800}
  .crumb-sep{font-size:1rem}
  .crumb .sm{display:none}
  @media (max-width:600px){
    .crumb .lg{display:none}
    .crumb .sm{display:inline}
    .crumbs{gap:4px 6px}
    .crumb{padding:5px 12px;font-size:1rem}
    .crumb.cur{padding:0 2px;font-size:1rem}
  }
footer a.back{font-weight:700;color:var(--fg);text-decoration:none}
footer a.back:hover,footer a.credit:hover{text-decoration:underline;text-underline-offset:3px}
footer a.credit{font-weight:700;color:var(--fg);text-decoration:none}

/* ===== HTML 퀴즈와 같은 모양 (배경, 머리글, 카드, 버튼, 보기) ===== */
:root{
  --fg:#33303c; --sub:#686472; --good:#397256; --lav:#bfb4e4;
  --accent:#437fba; --accent-sh:#3f6085; --accent-soft:#e4edf7; --accent-ink:#2c4a6b;
  --tok:#c2701c;
}
body{background-color:#eff4fa;background-image:linear-gradient(160deg,#eff4fa 0%,#eaeff8 50%,#e9f3f8 100%);background-size:100% 100%;background-attachment:fixed;padding-block:28px 48px}
.wrap{gap:18px}
header.top{display:flex;align-items:center;gap:14px;padding:0 4px}
.mascot{flex:none;font-size:2.3rem;width:62px;height:62px;border-radius:20px;background:#ffffff;display:grid;place-items:center;border:2.2px solid #bcb7c4;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
header .pre{display:inline-block;font-size:min(.85rem,3.4vw);font-weight:700;color:#33303c;margin-bottom:6px;white-space:nowrap}
header h1{margin:0;font-weight:800;font-size:clamp(1.3rem,5.4vw,1.7rem);line-height:1.25;text-wrap:balance}
header p{margin:4px 0 0;font-size:.95rem;color:var(--sub)}
.box,.big{background:#ffffff;border:none;border-radius:28px;padding:28px;box-shadow:0 8px 0 #c9c2d5,0 20px 40px rgba(105,92,121,.12)}
@media (max-width:560px){.box,.big{padding:20px;border-radius:24px}}
.hud{font-weight:700;color:var(--sub)}
.hud #hudStage{color:#33303c;font-size:1.35rem;font-weight:800}
.strip{flex-wrap:nowrap;gap:6px;margin:12px 0 16px}
.strip span{flex:1;width:auto;height:10px;border-radius:999px;background:#f2eef7;font-size:0;color:transparent;box-shadow:none}
.strip span.done{background:var(--good)}
.strip span.now{background:var(--lav);box-shadow:none}
.badge{background:#ecf3f9;color:#415e75;font-size:.85rem;padding:3px 12px}
.sit{background:#f7f2e6;border:none;border-radius:16px;padding:10px 14px}
.sit b{color:#415e75}
.know{background:#f9fbfc;border:2px solid #ddd7e6;border-radius:16px;padding:10px 14px}
.know h4{color:#415e75;font-size:.9rem}
.hint{background:#faf7ef;border:2px solid #ddd7e6;border-radius:16px;padding:10px 14px}
.hint b{color:#725d28}
.msg{border-radius:16px;padding:10px 14px}
.qtitle{font-size:1.25rem;line-height:1.5;margin:12px 0 8px}
.opt,.symbtn,.chip{background:#fdfcf9;border:2.5px solid #ddd7e6;border-radius:18px;box-shadow:0 4px 0 #c9c2d5;transition:transform .12s,box-shadow .12s,border-color .15s}
.opt{padding:12px 14px;min-height:56px;align-items:center}
.opt:hover:not(:disabled),.symbtn:hover:not(:disabled),.chip:hover:not(:disabled){border-color:#b5adc6;transform:translateY(-2px);box-shadow:0 6px 0 #b5adc6}
.opt .n{width:30px;height:30px;background:#ddd7e6;font-size:.9rem}

<script>
/* ===== 순서도 그리기 도구 ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 기호를 배우는 단계: 그 단계 전까지는 회색 상자로 보인다 */
const KIND_STAGE = { term: 1, arrow: 2, io: 3, proc: 4, dec: 5, doc: 9, db: 9, sub: 10, conn: 10 };

/* 기호 사전: 우리말 이름, 영문 이름, 쓰임, 구분 */
const SYMDEF = {
  term:    { ko: '단말', en: 'Terminator', mean: '시작과 끝', use: '서비스나 프로그램이 시작하고 끝나는 곳', lv: '기본' },
  arrow:   { ko: '흐름선', en: 'Flowline (Arrow)', mean: '순서와 방향', use: '다음에 어디로 갈지 알려 주는 선', lv: '기본' },
  io:      { ko: '입출력', en: 'Input / Output (Data)', mean: '입력과 출력', use: '값을 받거나 결과를 보여 주는 곳', lv: '기본' },
  proc:    { ko: '처리', en: 'Process', mean: '처리(계산)', use: '계산하거나 값을 바꾸는 일', lv: '기본' },
  dec:     { ko: '판단', en: 'Decision', mean: '예와 아니오를 묻는 질문', use: '조건에 따라 길을 둘로 나누는 곳', lv: '기본' },
  doc:     { ko: '문서', en: 'Document', mean: '문서(영수증 같은 것)', use: '영수증, 보고서처럼 문서로 나오는 결과', lv: '실무에서 자주 씀' },
  db:      { ko: '데이터베이스', en: 'Database (Stored Data)', mean: '자료 저장소', use: '재고, 회원 정보처럼 저장해 두고 읽고 쓰는 자료', lv: '실무에서 자주 씀' },
  sub:     { ko: '미리 정의된 처리', en: 'Predefined Process (Subroutine)', mean: '따로 만들어 둔 처리를 불러오는 일', use: '복잡한 일을 한 칸으로 묶고 자세한 순서도는 따로 그림', lv: '실무에서 자주 씀' },
  conn:    { ko: '연결자', en: 'Connector', mean: '떨어진 곳을 이어 주는 일', use: '같은 글자가 적힌 두 원은 이어져 있다는 뜻', lv: '실무에서 자주 씀' },
  hex:     { ko: '준비', en: 'Preparation', mean: '반복을 준비하는 일', use: '반복 전에 값을 준비하는 칸', lv: '참고' },
  manual:  { ko: '수동 입력', en: 'Manual Input', mean: '사람이 직접 입력하는 일', use: '키보드나 터치로 사람이 직접 넣는 값', lv: '참고' },
  display: { ko: '표시', en: 'Display', mean: '화면에 보여 주는 일', use: '모니터나 키오스크 화면에 보여 주는 결과', lv: '참고' }
};
const SYMNAME = {}, SYMMEAN = {};
Object.keys(SYMDEF).forEach(k => { SYMNAME[k] = SYMDEF[k].ko; SYMMEAN[k] = SYMDEF[k].mean; });
function josa(word) {
  const c = word.charCodeAt(word.length - 1);
  return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0) ? '은' : '는';
}

function shapeSvg(n, real) {
  const x = n.cx - n.w / 2, y = n.cy - n.h / 2, w = n.w, h = n.h;
  if (!real) return `<rect class="sh" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>`;
  if (n.k === 'term') return `<rect class="sh term" x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}"/>`;
  if (n.k === 'io') return `<polygon class="sh" points="${x + 14},${y} ${x + w},${y} ${x + w - 14},${y + h} ${x},${y + h}"/>`;
  if (n.k === 'dec') return `<polygon class="sh" points="${n.cx},${y} ${x + w},${n.cy} ${n.cx},${y + h} ${x},${n.cy}"/>`;
  if (n.k === 'conn') return `<circle class="sh" cx="${n.cx}" cy="${n.cy}" r="${Math.min(w, h) / 2}"/>`;
  if (n.k === 'sub') return `<rect class="sh" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/><path class="sh2" d="M${x + 12},${y} V${y + h} M${x + w - 12},${y} V${y + h}"/>`;
  if (n.k === 'db') return `<path class="sh" d="M${x},${y + 9} C${x},${y - 3} ${x + w},${y - 3} ${x + w},${y + 9} V${y + h - 9} C${x + w},${y + h + 3} ${x},${y + h + 3} ${x},${y + h - 9} Z"/><path class="sh2" d="M${x},${y + 9} C${x},${y + 21} ${x + w},${y + 21} ${x + w},${y + 9}"/>`;
  if (n.k === 'doc') return `<path class="sh" d="M${x},${y} H${x + w} V${y + h - 8} C${x + w * 0.75},${y + h - 18} ${x + w * 0.65},${y + h + 2} ${x + w * 0.5},${y + h - 8} C${x + w * 0.35},${y + h - 18} ${x + w * 0.25},${y + h + 2} ${x},${y + h - 8} Z"/>`;
  return `<rect class="sh" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>`;
}

function nodePos(spec, id) {
  const n = spec.nodes.find(z => z.id === id);
  if (!n) return [0, 0];
  return n.k === 'dec' ? [n.cx - n.w / 2 + 18, n.cy] : [n.cx - n.w / 2 + 10, n.cy - n.h / 2 + 2];
}

/* o: uid, n(현재 단계 번호), view, revealed(Set), blank, focus[], pick{ids,labels,state}, ynNode, ynState, ynDone[], token */
function drawFlow(spec, o) {
  o = o || {};
  const uid = o.uid || 'f';
  const view = (o.view || [0, 0, spec.w, spec.h]).join(' ');
  const arrows = spec.allBlank || o.n == null || o.n >= 2;
  const rev = o.revealed || new Set();
  let out = `<svg class="fc" viewBox="${view}" role="group" aria-label="${esc(spec.alt)}">`;
  out += `<defs><marker id="${uid}a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" style="fill:var(--sub)"/></marker></defs>`;
  spec.lines.forEach(l => {
    const d = 'M' + l.p.map(p => p.join(',')).join(' L');
    const on = (o.ynDone || []).some(d2 => d2.node === l.of && d2.val === l.yn) ? ' on' : '';
    out += `<g><path class="ln${on}" d="${d}"${arrows && !l.nr ? ` marker-end="url(#${uid}a)"` : ''}/>`;
    if (l.lb && l.of !== o.ynNode) out += `<text class="lb" x="${l.lb[1]}" y="${l.lb[2]}">${esc(l.lb[0])}</text>`;
    out += '</g>';
  });
  spec.nodes.forEach(n => {
    const isBlank = o.blank === n.id;
    const real = !isBlank && (spec.allBlank ? rev.has(n.id) : (rev.has(n.id) || KIND_STAGE[n.k] < (o.n || 99)));
    let cls = real ? '' : 'neutral';
    if (isBlank) cls = 'blank';
    if (o.focus && o.focus.includes(n.id) && !isBlank) cls += ' focus';
    let attrs = '', badge = '';
    if (o.pick && o.pick.ids.includes(n.id)) {
      const st = (o.pick.state && o.pick.state[n.id]) || '';
      cls += ' pickable ' + st;
      attrs = ` data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(n.t)}"`;
      badge = `<g class="pbadge"><circle cx="${n.cx + n.w / 2 - 6}" cy="${n.cy - n.h / 2 + 2}" r="11"/><text x="${n.cx + n.w / 2 - 6}" y="${n.cy - n.h / 2 + 6.5}" text-anchor="middle">${o.pick.labels[n.id]}</text></g>`;
    }
    const dy = real ? (n.k === 'doc' ? -4 : (n.k === 'db' ? 5 : 0)) : 0;
    out += `<g class="nd ${cls}"${attrs}>${shapeSvg(n, real)}<text x="${n.cx}" y="${n.cy + 4.5 + dy}" text-anchor="middle">${esc(n.t)}</text>${badge}</g>`;
  });
  if (o.ynNode) {
    spec.lines.filter(l => l.of === o.ynNode && l.lb).forEach(l => {
      const t = l.lb[0], x = l.lb[1], y = l.lb[2], w = t.length * 13 + 18;
      const st = (o.ynState && o.ynState[l.yn]) || '';
      out += `<g class="ynbtn ${st}" data-yn="${l.yn}" tabindex="0" role="button" aria-label="${esc(t)} 길"><rect x="${x - 9}" y="${y - 17}" width="${w}" height="26" rx="13"/><text x="${x}" y="${y}">${esc(t)}</text></g>`;
    });
  }
  if (o.token) {
    const p = nodePos(spec, o.token);
    out += `<circle class="tok" r="10" cx="0" cy="0" style="transform:translate(${p[0]}px,${p[1]}px)"/>`;
  }
  return out + '</svg>';
}

/* ===== 게임 진행: 문제는 순서도 위에서 직접 풀어요 ===== */
const $ = id => document.getElementById(id);
const LET = ['가', '나', '다', '라', '마', '바', '사', '아', '자', '차', '카'];
const SPECS = { main: MAIN, boss: BOSS, docdb: DOCDB, subconn: SUBCONN };
const TOTAL = STAGES.reduce((a, s) => a + s.qs.reduce((b, q) => b + q.steps.length, 0), 0);
let G;

const spec = () => SPECS[(G.q && G.q.chart) || 'main'];
const nodeText = id => (spec().nodes.find(n => n.id === id) || {}).t || id;
const revKey = id => ((G.q && G.q.chart) || 'main') + ':' + id;
const starsOf = d => '★'.repeat(d) + '☆'.repeat(3 - d);
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

function newGame() {
  G = { stage: 0, qi: 0, si: 0, score: 0, perfect: STAGES.map(() => true), done: false, revealed: new Set(), full: false, log: [], ynDone: [], first: true, solved: false, tokenAt: null, ex: {}, cur: null, q: null };
  $('hudTotal').textContent = TOTAL;
  $('hudAll').textContent = STAGES.length;
  $('mapToggle').hidden = false;
  startQuestion();
}

function renderStrip() {
  $('strip').innerHTML = STAGES.map((s, i) => `<span class="${i < G.stage ? 'done' : (i === G.stage ? 'now' : '')}">${i < G.stage ? '✔' : LET[i]}</span>`).join('');
  $('hudStage').textContent = G.stage + 1;
  $('hudScore').textContent = G.score;
}

function renderMap() {
  const q = G.q, sp = spec();
  const rev = new Set([...G.revealed].filter(k => k.startsWith(((q && q.chart) || 'main') + ':')).map(k => k.split(':')[1]));
  const view = G.full || !q.view ? [0, 0, sp.w, sp.h] : q.view;
  const o = Object.assign({}, G.ex, { uid: 'm' + G.stage + 'q' + G.qi + 's' + G.si + (G.full ? 'f' : 'v'), n: G.done ? 99 : G.stage + 1, view, revealed: rev, token: G.tokenAt, ynDone: G.ynDone });
  $('map').innerHTML = drawFlow(sp, o);
  $('map').classList.toggle('full', G.full);
  $('mapToggle').textContent = G.full ? '이 부분만 보기' : '전체 보기';
  $('mapCap').textContent = G.done ? '완성한 전체 순서도입니다.' : (G.full ? '전체 순서도를 보고 있습니다.' : '주황색 동그라미가 말이에요. 문제는 순서도 위에서 풀자.');
}

function moveToken(id) {
  G.tokenAt = id;
  const el = document.querySelector('#map .tok');
  if (!el) return;
  const p = nodePos(spec(), id);
  el.getBoundingClientRect();
  el.style.transform = `translate(${p[0]}px,${p[1]}px)`;
}

function startQuestion() {
  const st = STAGES[G.stage];
  G.q = st.qs[G.qi]; G.si = 0; G.log = []; G.ynDone = []; G.tokenAt = G.q.from; G.full = false;
  $('card').hidden = false;
  $('card').innerHTML = `<div class="know"><h4>${esc(st.know[0])}</h4><p>${esc(st.know[1])}</p></div>`
    + G.q.hints.map((t, i) => `<div class="hint"><b>힌트 ${i + 1}</b> ${esc(t)}</div>`).join('')
    + `<div class="diff">난이도 <span class="stars">${starsOf(st.diff)}</span></div>`;
  renderStrip();
  startStep();
}

function stepQuestion(S) {
  if (S.q) return S.q;
  if (S.t === 'sym') return `"${nodeText(S.node)}" 칸에 알맞은 기호는? 아래에서 골라 보세요.`;
  if (S.t === 'yn') return '순서도에서 알맞은 길("예" 또는 "아니오")을 눌러 보세요.';
  return '말이 다음에 도착할 칸은? 순서도에서 가, 나, 다 표시가 붙은 칸 중 하나를 눌러 보세요.';
}

function startStep() {
  const st = STAGES[G.stage], q = G.q, S = q.steps[G.si];
  G.cur = S; G.first = true; G.solved = false;
  let h = `<div class="qhead"><span class="badge">${LET[G.stage]}. ${esc(st.name)}</span><span style="color:var(--sub);font-size:.9rem">문제 ${G.qi + 1} / ${st.qs.length}, 질문 ${G.si + 1} / ${q.steps.length}</span></div>`;
  h += `<div class="sit"><b>상황</b> ${esc(q.sit)}</div>`;
  if (G.log.length) h += `<div class="done-steps">${G.log.map(t => `<span>✔ ${esc(t)}</span>`).join('')}</div>`;
  h += `<div class="step"><h3>${esc(stepQuestion(S))}</h3></div>`;
  $('prompt').innerHTML = h;
  $('fb').innerHTML = ''; $('nx').innerHTML = '';
  const T = $('tray');
  G.ex = { focus: [], ynState: {} };
  if (S.t === 'sym') {
    G.ex.blank = S.node;
    const kinds = S.choices || ['term', 'io', 'proc', 'dec'];
    T.innerHTML = `<div class="symgrid">${shuffle(kinds).map(k => `<button type="button" class="symbtn" data-k="${k}">${symSvg(k)}<span class="ko">${SYMDEF[k].ko}</span><span class="en">${SYMDEF[k].en}</span></button>`).join('')}</div>`;
    T.querySelectorAll('.symbtn').forEach(b => b.addEventListener('click', () => onSym(b.dataset.k, b)));
  } else if (S.t === 'yn') {
    G.ex.ynNode = S.node; G.ex.focus = [S.node];
    T.innerHTML = `<div class="yn"><button type="button" class="opt" data-yn="yes">예 길</button><button type="button" class="opt" data-yn="no">아니오 길</button></div>`;
    T.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => onYn(b.dataset.yn)));
  } else if (S.t === 'next') {
    const order = shuffle(S.cands), labels = {};
    order.forEach((id, k) => labels[id] = LET[k]);
    G.ex.pick = { ids: order, labels, state: {} };
    T.innerHTML = `<div class="opts">${order.map(id => `<button type="button" class="opt" data-id="${id}"><span class="n">${labels[id]}</span><span>${esc(nodeText(id))}</span></button>`).join('')}</div>`;
    T.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => onNext(b.dataset.id)));
  } else {
    const idx = shuffle([0, 1, 2]);
    T.innerHTML = `<div class="opts">${idx.map((o, k) => `<button type="button" class="opt" data-o="${o}"><span class="n">${k + 1}</span><span>${esc(S.opts[o])}</span></button>`).join('')}</div>`;
    T.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => onMcq(+b.dataset.o, b)));
  }
  renderMap();
}

function fb(ok, title, text) {
  $('fb').innerHTML = `<div class="msg ${ok ? 'ok' : 'no'}"><b>${esc(title)}</b><span>${esc(text)}</span></div>`;
}

function stepLog(S) {
  if (S.t === 'sym') return `${nodeText(S.node)} 칸: ${SYMNAME[S.ans]}`;
  if (S.t === 'yn') return `${nodeText(S.node)}: ${S.ans === 'yes' ? '예' : '아니오'} 길`;
  if (S.t === 'next') return `다음 칸: ${nodeText(S.ans)}`;
  return S.opts[0].length > 26 ? S.opts[0].slice(0, 26) + '...' : S.opts[0];
}

function solvedStep(S) {
  G.solved = true;
  if (G.first) G.score++; else G.perfect[G.stage] = false;
  $('hudScore').textContent = G.score;
  G.log.push(stepLog(S));
  fb(true, '정답이에요!', S.e);
  const last = G.si === G.q.steps.length - 1;
  if (S.t === 'next') moveToken(S.ans);
  if (last && G.tokenAt !== G.q.to) moveToken(G.q.to);
  const lastStage = G.stage === STAGES.length - 1, lastQ = G.qi === STAGES[G.stage].qs.length - 1;
  const label = !last ? '다음 질문 ▶' : (lastQ ? (lastStage ? '결과 보기 ▶' : '다음 단계로 ▶') : '다음 문제 ▶');
  $('nx').innerHTML = `<button class="btn go" id="nextBtn" type="button">${label}</button>`;
  $('nextBtn').addEventListener('click', advance);
  $('nextBtn').focus({ preventScroll: true });
}

function advance() {
  const st = STAGES[G.stage], last = G.si === G.q.steps.length - 1;
  if (!last) { G.si++; startStep(); return; }
  if (G.qi < st.qs.length - 1) { G.qi++; }
  else if (G.stage < STAGES.length - 1) { G.stage++; G.qi = 0; }
  else { G.done = true; renderFinal(); scrollTop(); return; }
  startQuestion();
  scrollTop();
}
function scrollTop() {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('strip').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}

/* ----- 기호 고르기 ----- */
function onSym(k, btn) {
  const S = G.cur;
  if (G.solved || btn.disabled) return;
  if (k === S.ans) {
    btn.classList.add('right');
    $('tray').querySelectorAll('.symbtn').forEach(b => b.disabled = true);
    G.revealed.add(revKey(S.node));
    (S.also || []).forEach(id => G.revealed.add(revKey(id)));
    G.ex.blank = null;
    renderMap();
    solvedStep(S);
  } else {
    G.first = false; btn.classList.add('wrong'); btn.disabled = true;
    fb(false, '아쉬워요. 다른 기호를 골라 보세요.', `${SYMNAME[k]}${josa(SYMNAME[k])} ${SYMMEAN[k]}에 쓰는 기호예요. 이 칸이 하는 일과 비교해 보세요.`);
  }
}

/* ----- 예/아니오 길 누르기 ----- */
function onYn(val) {
  const S = G.cur;
  if (G.solved) return;
  const trayBtn = $('tray').querySelector(`[data-yn="${val}"]`);
  if (val === S.ans) {
    G.ynDone.push({ node: S.node, val });
    G.ex.ynNode = null;
    $('tray').querySelectorAll('.opt').forEach(b => b.disabled = true);
    if (trayBtn) trayBtn.classList.add('right');
    renderMap();
    solvedStep(S);
  } else {
    G.first = false; G.ex.ynState[val] = 'wrong';
    if (trayBtn) { trayBtn.classList.add('wrong'); trayBtn.disabled = true; }
    renderMap();
    fb(false, '아쉬워요. 조건을 다시 따져 보세요.', S.h || '조건에 값을 넣어서 맞는 말인지 틀린 말인지 먼저 따져 보세요. 힌트를 참고하세요.');
  }
}

/* ----- 다음 칸 예측 ----- */
function onNext(id) {
  const S = G.cur;
  if (G.solved || !G.ex.pick || !G.ex.pick.ids.includes(id)) return;
  const trayBtn = $('tray').querySelector(`[data-id="${id}"]`);
  if (id === S.ans) {
    G.ex.pick.state[id] = 'right';
    $('tray').querySelectorAll('.opt').forEach(b => b.disabled = true);
    if (trayBtn) trayBtn.classList.add('right');
    renderMap();
    solvedStep(S);
  } else {
    G.first = false; G.ex.pick.state[id] = 'wrong';
    if (trayBtn) { trayBtn.classList.add('wrong'); trayBtn.disabled = true; }
    renderMap();
    fb(false, '아쉬워요. 다른 칸을 골라 보세요.', S.w || '화살표가 이어진 다음 칸이 아니에요. 화살표 방향을 따라가 보세요.');
  }
}

/* ----- 보기 고르기 ----- */
function onMcq(o, btn) {
  const S = G.cur;
  if (G.solved || btn.disabled) return;
  if (o === 0) {
    btn.classList.add('right');
    $('tray').querySelectorAll('.opt').forEach(b => b.disabled = true);
    solvedStep(S);
  } else {
    G.first = false; btn.classList.add('wrong'); btn.disabled = true;
    fb(false, '아쉬워요. 다른 보기를 골라 보세요.', S.m[o - 1]);
  }
}

/* ----- 순서도 위 누르기(예/아니오 글자, 가나다 표시 칸) ----- */
$('map').addEventListener('click', e => {
  if (!G || G.done || G.solved) return;
  const y = e.target.closest('[data-yn]');
  if (y) { onYn(y.getAttribute('data-yn')); return; }
  const n = e.target.closest('[data-node]');
  if (n) onNext(n.getAttribute('data-node'));
});
$('map').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target.closest && e.target.closest('[data-yn],[data-node]');
  if (t) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('keydown', e => {
  if (!G || G.done || G.solved || !G.cur || G.cur.t !== 'mcq' || !/^[1-3]$/.test(e.key)) return;
  const b = $('tray').querySelectorAll('.opt')[+e.key - 1];
  if (b) b.click();
});
$('mapToggle').addEventListener('click', () => {
  if (!G || G.done) return;
  G.full = !G.full;
  renderMap();
});

/* ----- 결과 ----- */
function renderFinal() {
  const pct = Math.round(G.score / TOTAL * 100);
  const n = pct >= 90 ? 3 : pct >= 70 ? 2 : 1;
  const perfect = G.perfect.filter(Boolean).length;
  G.q = { chart: 'main', view: [0, 0, MAIN.w, MAIN.h] }; G.full = true; G.ex = {}; G.tokenAt = 'end'; G.ynDone = [];
  renderStrip();
  $('strip').innerHTML = STAGES.map(() => '<span class="done">✔</span>').join('');
  $('hudStage').textContent = STAGES.length;
  $('card').hidden = true; $('tray').innerHTML = ''; $('fb').innerHTML = ''; $('nx').innerHTML = '';
  $('mapToggle').hidden = true;
  $('prompt').innerHTML = `<div class="finalbox">
    <span class="badge">게임 클리어</span>
    <h2>무인 베이커리 순서도를 완성했습니다</h2>
    <p style="margin:0 0 10px"><span class="stars" style="font-size:1.6rem">${'★'.repeat(n)}${'☆'.repeat(3 - n)}</span></p>
    <div class="know"><h4>내 기록</h4><p>한 번에 맞힌 질문 ${G.score} / ${TOTAL} (100점 환산 ${pct}점), 모든 질문을 한 번에 푼 단계 ${perfect} / ${STAGES.length}</p></div>
    <div class="know"><h4>오늘 익힌 것</h4><p>타원(단말)은 시작과 끝, 화살표(흐름선)는 순서, 평행사변형(입출력)은 입력과 출력, 직사각형(처리)은 계산, 마름모(판단)는 예와 아니오 질문입니다. 실무에서 자주 쓰는 문서, 데이터베이스, 미리 정의된 처리(서브루틴), 연결자도 익혔습니다. 아래 순서도는 키오스크의 전체 흐름이고, 위의 기호 사전에서 영문과 우리말 이름을 다시 볼 수 있습니다.</p></div>
    <div class="row"><button class="btn" id="again" type="button">처음부터 다시 하기</button></div>
  </div>`;
  $('again').addEventListener('click', newGame);
  renderMap();
}

/* ----- 기호 사전 ----- */
function renderDict() {
  const order = ['term', 'arrow', 'io', 'proc', 'dec', 'doc', 'db', 'sub', 'conn', 'hex', 'manual', 'display'];
  $('dictBody').innerHTML = `<p class="dnote">구분은 대략적인 기준이에요. 교과서와 도구(draw.io, 비지오 등)마다 우리말 이름이 조금씩 달라요.</p>`
    + `<div class="dlist">${order.map(k => { const d = SYMDEF[k]; return `<div class="drow"><div class="dsym">${symSvg(k)}</div><div class="dtxt"><div><b>${esc(d.ko)}</b> <span class="den">${esc(d.en)}</span></div><div class="duse">${esc(d.use)}</div><span class="dlv lv${d.lv === '기본' ? 1 : d.lv === '참고' ? 3 : 2}">${esc(d.lv)}</span></div></div>`; }).join('')}</div>`;
}
renderDict();
newGame();
</script>
</body>
</html>
